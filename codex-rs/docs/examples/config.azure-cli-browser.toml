# Example configuration for using Azure OpenAI with Azure CLI and Interactive Browser auth

# Select a profile when launching Codex, e.g.:
#   codex --profile azure-cli

[model_providers.azure-cli]
name = "Azure via Azure CLI"
base_url = "https://YOUR_RESOURCE.openai.azure.com/openai"
wire_api = "responses"
query_params = { api-version = "2025-04-01-preview" }
auth = { type = "azure_cli" }

[profiles.azure-cli]
model = "o3"
model_provider = "azure-cli"


[model_providers.azure-interactive]
name = "Azure via Interactive Browser"
base_url = "https://YOUR_RESOURCE.openai.azure.com/openai"
wire_api = "responses"
query_params = { api-version = "2025-04-01-preview" }
# tenant_id/client_id optional
auth = { type = "azure_interactive_browser" }

[profiles.azure-interactive]
model = "o3"
model_provider = "azure-interactive"

